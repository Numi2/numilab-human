name: Integrate Human long-horizon release launch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-long-horizon-launch.yml
permissions:
  contents: write
concurrency:
  group: integrate-human-long-horizon-launch
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pytest -e .
      - name: Add explicit no-step-trace release mode
        shell: python
        run: |
          from pathlib import Path

          command = Path('.numi/commands/human')
          text = command.read_text(encoding='utf-8')

          usage_old = '[--mechanics-overlay] [--mechanics-only] [--assisted-diagnostic]'
          usage_new = usage_old + ' [--no-step-trace]'
          assert text.count(usage_old) == 2
          text = text.replace(usage_old, usage_new)

          state_old = '''    mechanics_only=false
              assisted_diagnostic=false
              while [ "$#" -gt 0 ]; do
          '''
          state_new = '''    mechanics_only=false
              assisted_diagnostic=false
              step_trace=true
              while [ "$#" -gt 0 ]; do
          '''
          assert text.count(state_old) == 1
          text = text.replace(state_old, state_new)

          parse_old = '''            --assisted-diagnostic)
                          [ "$assisted_diagnostic" = false ] || { printf '%s\\n' "--assisted-diagnostic may be given only once" >&2; exit 2; }
                          assisted_diagnostic=true
                          shift
                          ;;
                      --mechanics-overlay)
          '''
          parse_new = '''            --assisted-diagnostic)
                          [ "$assisted_diagnostic" = false ] || { printf '%s\\n' "--assisted-diagnostic may be given only once" >&2; exit 2; }
                          assisted_diagnostic=true
                          shift
                          ;;
                      --no-step-trace)
                          [ "$step_trace" = true ] || { printf '%s\\n' "--no-step-trace may be given only once" >&2; exit 2; }
                          step_trace=false
                          shift
                          ;;
                      --mechanics-overlay)
          '''
          assert text.count(parse_old) == 1
          text = text.replace(parse_old, parse_new)

          flags_old = '''        --persistent-source-passive-joint-tissue \\
                  --stand-contact-iterations 64 \\
                  --persistent-stand-trace \\
                  --stand-deterministic-replay \\
                  --dimension "$dimension"
              if [ "$assisted_diagnostic" = true ]; then
          '''
          flags_new = '''        --persistent-source-passive-joint-tissue \\
                  --stand-contact-iterations 64 \\
                  --stand-deterministic-replay \\
                  --dimension "$dimension"
              if [ "$step_trace" = true ]; then
                  set -- "$@" --persistent-stand-trace
              fi
              if [ "$assisted_diagnostic" = true ]; then
          '''
          assert text.count(flags_old) == 1
          text = text.replace(flags_old, flags_new)
          command.write_text(text, encoding='utf-8')

          tests = Path('tests/test_stand_execution_options.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''

          def test_long_horizon_release_can_skip_per_step_trace_without_assistance(launch):
              result, argv, _, _ = launch(
                  '--mechanics-only', '--no-step-trace',
                  '--steps', '1000', '--timestep', '0.0001',
              )
              assert result.returncode == 0, result.stderr
              assert '--persistent-stand-trace' not in argv
              assert '--stand-deterministic-replay' in argv
              assert '--stand-root-assistance' not in argv
              assert '--stand-remove-assistance' not in argv
              assert argv[argv.index('--muscle-step-count') + 1] == '1000'
              assert argv[argv.index('--muscle-step-seconds') + 1] == '0.0001'


          def test_no_step_trace_is_not_silently_repeatable(launch):
              result, argv, _, _ = launch('--no-step-trace', '--no-step-trace')
              assert result.returncode == 2
              assert argv is None
          '''
          addition = addition.replace('\n          ', '\n').lstrip('\n')
          assert 'test_long_horizon_release_can_skip_per_step_trace_without_assistance' not in test_text
          tests.write_text(test_text.rstrip() + '\n\n' + addition, encoding='utf-8')
      - name: Verify launch behavior and equilibrium contracts
        run: |
          python -m pytest -q \
            tests/test_stand_execution_options.py \
            tests/test_native_mechanics_summary.py \
            tests/test_native_passive_stand_refinement.py \
            tests/test_native_refinement_free_acceleration.py \
            tests/test_native_trace_refinement.py
          git diff --check
      - name: Publish tested launch increment
        run: |
          git add .numi/commands/human tests/test_stand_execution_options.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add explicit summary-only Human release horizons'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > human-long-horizon-launch-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-long-horizon-launch-source
          path: human-long-horizon-launch-revision.txt
          retention-days: 14
          if-no-files-found: warn
