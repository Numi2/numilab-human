name: Integrate precise Human free-acceleration semantics
on:
  push:
    branches: [main]
    paths: [.github/workflows/integrate-free-acceleration-terminology-v2.yml]
permissions:
  contents: write
concurrency:
  group: integrate-human-free-acceleration-semantics-v2
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install pytest -e .
      - name: Apply precise terminology to the evidence compiler
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/numilab_human/native_passive_stand_refinement.py')
          text = path.read_text()
          old_block = '''        smooth = [row["velocity_stage_diagnostics"]["maximum_free_acceleration_mixed_units"]
                  for row in cases]
        smooth_low, smooth_high = min(smooth), max(smooth)
        smooth_ratio = ((smooth_high - smooth_low) / smooth_low if smooth_low > 0.0
                        else (0.0 if smooth_high == 0.0 else None))
'''
          new_block = '''        free_acceleration = [
            row["velocity_stage_diagnostics"]["maximum_free_acceleration_mixed_units"]
            for row in cases
        ]
        free_low, free_high = min(free_acceleration), max(free_acceleration)
        free_ratio = ((free_high - free_low) / free_low if free_low > 0.0
                      else (0.0 if free_high == 0.0 else None))
'''
          assert text.count(old_block) == 1
          text = text.replace(old_block, new_block)

          old_fields = '''            "smooth_force_acceleration_range_over_minimum": smooth_ratio,
            "smooth_force_acceleration_relative_tolerance": tolerance,
            "smooth_force_acceleration_converged": smooth_ratio is not None and smooth_ratio <= tolerance,
            "maximum_smooth_force_acceleration_mixed_units": smooth_high,
'''
          new_fields = '''            "free_force_acceleration_range_over_minimum": free_ratio,
            "free_force_acceleration_relative_tolerance": tolerance,
            "free_force_acceleration_converged": free_ratio is not None and free_ratio <= tolerance,
            "maximum_free_force_acceleration_mixed_units": free_high,
            "free_force_acceleration_semantics": (
                "unconstrained M_effective^-1 applied-force acceleration before contact, equality, "
                "and joint-limit projection; not a constrained physical body acceleration"
            ),
'''
          assert text.count(old_fields) == 1
          text = text.replace(old_fields, new_fields)

          old_compiler = '"compiler": "numilab-human.native-passive-stand-refinement.3"'
          new_compiler = '"compiler": "numilab-human.native-passive-stand-refinement.4"'
          assert text.count(old_compiler) == 1
          text = text.replace(old_compiler, new_compiler)

          old_reason = '''            "Matching acceleration peaks alone do not establish force convergence; compare same-time state, "
            "constraint reactions, complementarity, and work on the bound source."
'''
          new_reason = '''            (("Free-force acceleration is grid-consistent, but it is unconstrained and can contain "
              "forces that are subsequently balanced by equality, contact, and joint-limit reactions. "
              "Compare same-time state, complete reactions, complementarity, and impulsive work."
              if stage_convergence and stage_convergence["free_force_acceleration_converged"]
              else "Separated velocity stages are available, but unconstrained free-force acceleration "
              "or the constrained trajectory is not yet timestep-converged.")
             if all(stage_presence) else
             "Matching legacy acceleration peaks alone do not establish force convergence; compare "
             "same-time state, constraint reactions, complementarity, and work on the bound source.")
'''
          assert text.count(old_reason) == 1
          text = text.replace(old_reason, new_reason)
          assert 'smooth_force_acceleration' not in text
          path.write_text(text)

          test = Path('tests/test_native_refinement_free_acceleration.py')
          test.write_text('''from __future__ import annotations

from pathlib import Path

import numilab_human.native_passive_stand_refinement as refinement


def test_free_force_acceleration_is_not_relabelled_as_constrained_motion(
    tmp_path: Path, monkeypatch
) -> None:
    monkeypatch.setattr(refinement, "CASE_ROOT", tmp_path)

    def case(_root, name, timestep, steps, **_kwargs):
        index = [row[0] for row in refinement.CASE_SPEC].index(name)
        return {
            "name": name,
            "duration_seconds": timestep * steps,
            "timestep_nanoseconds": int(round(timestep * 1.0e9)),
            "step_count": steps,
            "compiled_stand_normalized_residual_rms": 1.0e-5,
            "persistent_max_acceleration_mps2": 20.0,
            "velocity_stage_diagnostics": {
                "maximum_free_acceleration_mixed_units": 100.0 + index,
                "maximum_constraint_delta_v_mixed_units": 0.01,
                "maximum_published_delta_v_mixed_units": 0.002,
            },
        }

    monkeypatch.setattr(refinement, "_case", case)
    result = refinement.compile_refinement(case_root=tmp_path)
    stage = result["convergence"]["velocity_stage"]
    assert result["compiler"].endswith(".4")
    assert "free_force_acceleration_range_over_minimum" in stage
    assert "maximum_free_force_acceleration_mixed_units" in stage
    assert "smooth_force_acceleration_range_over_minimum" not in stage
    assert "unconstrained" in stage["free_force_acceleration_semantics"]
    assert "not a constrained physical body acceleration" in stage["free_force_acceleration_semantics"]
    assert "unconstrained" in result["blocker"]["reason"].lower()
    assert not result["qualification"]["force_convergence"]
''')
      - name: Verify evidence contracts
        run: |
          python -m pytest -q \
            tests/test_native_passive_stand_refinement.py \
            tests/test_native_refinement_binding.py \
            tests/test_native_refinement_stage_diagnostics.py \
            tests/test_native_refinement_free_acceleration.py
          git diff --check
      - name: Publish tested source increment
        run: |
          git add src/numilab_human/native_passive_stand_refinement.py tests/test_native_refinement_free_acceleration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Name Human free acceleration as unconstrained evidence'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > human-free-acceleration-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-free-acceleration-source-v2
          path: human-free-acceleration-revision.txt
          retention-days: 14
          if-no-files-found: warn
