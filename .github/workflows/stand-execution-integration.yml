name: Integrate source-bound stand execution defaults
on:
  push:
    branches: [main]
    paths: [.github/workflows/stand-execution-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest -e .
      - name: Apply exact scoped source changes
        run: python tools/integrate_stand_execution.py
      - name: Verify affected launch paths and all equilibrium contracts
        run: |
          python -m pytest -q --junitxml=stand-execution-results.xml tests/test_stand_execution_options.py tests/test_native_mechanics_summary.py tests/test_static_dynamic_handoff.py tests/test_native_force_convergence.py tests/test_equilibrium_force_snapshot.py tests/test_initial_force_reference.py tests/test_force_ledger.py tests/test_standing_state.py tests/test_native_passive_stand_refinement.py tests/test_native_refinement_binding.py
          python -m pytest -q tests/test_importer.py -k numi_workspace
          git diff --check
      - name: Publish tested source changes only
        run: |
          test "$GITHUB_REF_NAME" = main
          git add -- .numi/commands/human src/numilab_human/native_force_convergence.py tests/test_importer.py
          git rm -- tools/integrate_stand_execution.py
          if git diff --cached --name-only | grep '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Launch Human standing without hidden assistance and read mechanics-only evidence'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > stand-execution-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-stand-execution-source
          path: |
            stand-execution-results.xml
            stand-execution-revision.txt
            .numi/commands/human
            src/numilab_human/native_force_convergence.py
            tests/test_importer.py
            tests/test_stand_execution_options.py
            tests/test_native_mechanics_summary.py
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
