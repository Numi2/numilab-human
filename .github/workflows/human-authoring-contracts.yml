name: Human authoring contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/numilab_human/**'
      - 'tests/**'
      - 'config/**'
      - 'schemas/**'
      - '.numi/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'sources.lock.json'
      - '.github/workflows/human-authoring-contracts.yml'
  pull_request:
    paths:
      - 'src/numilab_human/**'
      - 'tests/**'
      - 'config/**'
      - 'schemas/**'
      - '.numi/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'sources.lock.json'
      - '.github/workflows/human-authoring-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoring-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test runner
        run: python -m pip install pytest 'jsonschema>=4.18,<5' -e .
      # These suites are intentionally explicit: a renamed or missing suite
      # must fail, not silently reduce coverage. Existing equilibrium CI remains.
      - name: Run ownership and loaded-knee authoring regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -ra --junitxml=human-authoring-results.xml \
            tests/test_ownership.py \
            tests/test_loaded_anatomy_knee.py \
            tests/test_loaded_anatomy_knee_source_compliance.py \
            2>&1 | tee human-authoring-results.log
      - name: Require executed tests without skips
        shell: bash
        run: |
          python - <<'PYRESULTS'
          import xml.etree.ElementTree as ET
          root = ET.parse("human-authoring-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No authoring tests executed"
          for tag in ("failure", "error", "skipped"):
              records = list(root.iter(tag))
              assert not records, f"Unexpected {tag} records: {[r.attrib for r in records]}"
          print(f"Verified {len(cases)} executed authoring tests with no skips")
          PYRESULTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-authoring-python-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            human-authoring-results.xml
            human-authoring-results.log
          if-no-files-found: error
          retention-days: 14
