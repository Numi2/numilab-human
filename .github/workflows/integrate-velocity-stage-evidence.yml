name: Integrate Human velocity-stage evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/integrate-velocity-stage-evidence.yml]
permissions:
  contents: write
concurrency:
  group: human-velocity-stage-evidence-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install pytest -e .
      - name: Apply fail-closed velocity-stage evidence support
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/numilab_human/native_passive_stand_refinement.py')
          text = path.read_text()
          old = '''    values = {name: _field(text, key) for name, key in metrics.items()}\n    _require(all(value >= 0.0 for value in values.values()), f"{name} negative norm/peak diagnostic")\n    return {"name": name, "timestep_seconds": timestep,\n            "timestep_nanoseconds": int(round(timestep * 1.0e9)), "step_count": steps,\n            "duration_seconds": timestep * completed, "persistent_completed_steps": completed,\n            **values, "persistent_max_penetration_m": penetration, "compiled_stand_balanced": True,\n            "stand_deterministic_replay": "bitwise", "stdout_sha256": _sha256(stdout),\n            "stderr_sha256": _sha256(stderr), "stdout": _relative(stdout), "stderr": _relative(stderr)}\n'''
          new = '''    values = {name: _field(text, key) for name, key in metrics.items()}\n    _require(all(value >= 0.0 for value in values.values()), f"{name} negative norm/peak diagnostic")\n    stage_fields = {\n        "maximum_free_acceleration_mixed_units": "persistent_max_free_acceleration",\n        "maximum_free_acceleration_dof": "persistent_max_free_acceleration_dof",\n        "maximum_constraint_delta_v_mixed_units": "persistent_max_constraint_delta_v",\n        "maximum_constraint_delta_v_dof": "persistent_max_constraint_delta_v_dof",\n        "maximum_pre_projection_delta_v_mixed_units": "persistent_max_pre_projection_delta_v",\n        "maximum_pre_projection_delta_v_dof": "persistent_max_pre_projection_delta_v_dof",\n        "maximum_published_delta_v_mixed_units": "persistent_max_published_delta_v",\n        "maximum_published_delta_v_dof": "persistent_max_published_delta_v_dof",\n    }\n    stage_tokens = [f"{key}=" in text for key in (\n        "persistent_max_acceleration_semantics", *stage_fields.values())]\n    _require(not any(stage_tokens) or all(stage_tokens),\n             f"{name} has a partial velocity-stage diagnostic record")\n    velocity_stage = None\n    if all(stage_tokens):\n        semantics = _field(text, "persistent_max_acceleration_semantics", cast=str)\n        _require(semantics == "pre_projection_total_delta_v_divided_by_timestep",\n                 f"{name} acceleration semantics changed")\n        stage: dict[str, Any] = {}\n        for output_name, native_name in stage_fields.items():\n            cast = int if output_name.endswith("_dof") else float\n            stage[output_name] = _field(text, native_name, cast=cast)\n        for key, value in stage.items():\n            if key.endswith("_dof"):\n                _require(0 <= value < 128, f"{name} invalid {key}")\n            else:\n                _require(value >= 0.0, f"{name} negative {key}")\n        legacy_rate = values["persistent_max_acceleration_mps2"]\n        reconstructed_rate = stage["maximum_pre_projection_delta_v_mixed_units"] / timestep\n        rate_tolerance = max(1.0e-5, 2.0e-5 * max(legacy_rate, reconstructed_rate, 1.0))\n        _require(abs(legacy_rate - reconstructed_rate) <= rate_tolerance,\n                 f"{name} legacy acceleration does not reconstruct pre-projection delta-v")\n        velocity_stage = {\n            "schema": "numi.human.velocity-stage-diagnostics.v1",\n            "legacy_acceleration_semantics": semantics,\n            **stage,\n            "reconstructed_pre_projection_rate_mixed_units": reconstructed_rate,\n            "legacy_rate_reconstruction_tolerance": rate_tolerance,\n        }\n    return {"name": name, "timestep_seconds": timestep,\n            "timestep_nanoseconds": int(round(timestep * 1.0e9)), "step_count": steps,\n            "duration_seconds": timestep * completed, "persistent_completed_steps": completed,\n            **values, "velocity_stage_diagnostics": velocity_stage,\n            "persistent_max_penetration_m": penetration, "compiled_stand_balanced": True,\n            "stand_deterministic_replay": "bitwise", "stdout_sha256": _sha256(stdout),\n            "stderr_sha256": _sha256(stderr), "stdout": _relative(stdout), "stderr": _relative(stderr)}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''    peaks = [row["persistent_max_acceleration_mps2"] for row in cases]\n    low, high = min(peaks), max(peaks)\n    ratio = (high - low) / low if low > 0.0 else (0.0 if high == 0.0 else None)\n    tolerance = 0.05\n    peak_consistent = ratio is not None and ratio <= tolerance\n    return {\n        "schema": SCHEMA, "compiler": "numilab-human.native-passive-stand-refinement.2",\n'''
          new = '''    peaks = [row["persistent_max_acceleration_mps2"] for row in cases]\n    low, high = min(peaks), max(peaks)\n    ratio = (high - low) / low if low > 0.0 else (0.0 if high == 0.0 else None)\n    tolerance = 0.05\n    peak_consistent = ratio is not None and ratio <= tolerance\n    stage_presence = [row["velocity_stage_diagnostics"] is not None for row in cases]\n    _require(not any(stage_presence) or all(stage_presence),\n             "velocity-stage diagnostics differ across refinement cases")\n    stage_convergence = None\n    if all(stage_presence):\n        smooth = [row["velocity_stage_diagnostics"]["maximum_free_acceleration_mixed_units"]\n                  for row in cases]\n        smooth_low, smooth_high = min(smooth), max(smooth)\n        smooth_ratio = ((smooth_high - smooth_low) / smooth_low if smooth_low > 0.0\n                        else (0.0 if smooth_high == 0.0 else None))\n        constraint_delta_v = [row["velocity_stage_diagnostics"]["maximum_constraint_delta_v_mixed_units"]\n                              for row in cases]\n        published_delta_v = [row["velocity_stage_diagnostics"]["maximum_published_delta_v_mixed_units"]\n                             for row in cases]\n        stage_convergence = {\n            "smooth_force_acceleration_range_over_minimum": smooth_ratio,\n            "smooth_force_acceleration_relative_tolerance": tolerance,\n            "smooth_force_acceleration_converged": smooth_ratio is not None and smooth_ratio <= tolerance,\n            "maximum_smooth_force_acceleration_mixed_units": smooth_high,\n            "maximum_constraint_delta_v_mixed_units": max(constraint_delta_v),\n            "minimum_constraint_delta_v_mixed_units": min(constraint_delta_v),\n            "maximum_published_delta_v_mixed_units": max(published_delta_v),\n            "minimum_published_delta_v_mixed_units": min(published_delta_v),\n            "constraint_events_temporally_converged": False,\n        }\n    return {\n        "schema": SCHEMA, "compiler": "numilab-human.native-passive-stand-refinement.3",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''                        "peak_acceleration_relative_tolerance": tolerance,\n                        "peak_acceleration_converged": peak_consistent,\n                        "force_convergence": False},\n'''
          new = '''                        "peak_acceleration_relative_tolerance": tolerance,\n                        "peak_acceleration_converged": peak_consistent,\n                        "legacy_peak_acceleration_is_constraint_rate_mixed": all(stage_presence),\n                        "velocity_stage_diagnostics_available": all(stage_presence),\n                        "velocity_stage": stage_convergence,\n                        "force_convergence": False},\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''        "blocker": {"id": "force_convergence", "status": "open", "reason": (\n            "Matching acceleration peaks alone do not establish force convergence; compare same-time state, "\n            "constraint reactions, complementarity, and work on the bound source."\n            if peak_consistent else f"Common-duration acceleration peaks are inconsistent: range/minimum={ratio!r}, tolerance={tolerance}.")},\n'''
          new = '''        "blocker": {"id": "force_convergence", "status": "open", "reason": (\n            ("Velocity stages are separated, but constraint event timing, same-time state, complete reactions, "\n             "complementarity and impulsive work remain unqualified."\n             if stage_convergence and stage_convergence["smooth_force_acceleration_converged"]\n             else "Separated smooth-force acceleration is not timestep converged; constraint and state evidence also remain open.")\n            if stage_convergence is not None else\n            ("Matching acceleration peaks alone do not establish force convergence; compare same-time state, "\n             "constraint reactions, complementarity, and work on the bound source."\n             if peak_consistent else f"Common-duration acceleration peaks are inconsistent: range/minimum={ratio!r}, tolerance={tolerance}."))},\n'''
          assert text.count(old) == 1
          path.write_text(text)

          test = Path('tests/test_native_refinement_stage_diagnostics.py')
          test.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\n\nimport numilab_human.native_passive_stand_refinement as refinement\nfrom numilab_human.model import ImportError\n\n\ndef _write_case(root: Path, *, omit: str | None = None, pre_delta: float = 0.002) -> None:\n    directory = root / "100us"\n    directory.mkdir()\n    fields = {\n        "myosim_articulated_mechanics": "ok",\n        "muscle_step_seconds": "0.0001",\n        "muscle_step_count": "64",\n        "persistent_completed_steps": "64",\n        "persistent_metal_horizon": "true",\n        "persistent_source_passive_joint_tissue": "true",\n        "compiled_stand_balanced": "true",\n        "stand_deterministic_replay": "bitwise",\n        "source_support_metal_device": "Apple M4 Pro",\n        "persistent_max_penetration_m": "0",\n        "persistent_max_acceleration": "20",\n        "compiled_stand_normalized_residual_rms": "0.001",\n        "source_dynamic_force_parity_max_delta_n": "0.01",\n        "muscle_step_max_velocity_delta": "0.0001",\n        "muscle_step_max_configuration_delta": "0.00001",\n        "persistent_max_acceleration_semantics": "pre_projection_total_delta_v_divided_by_timestep",\n        "persistent_max_free_acceleration": "1.5",\n        "persistent_max_free_acceleration_dof": "7",\n        "persistent_max_constraint_delta_v": "0.002",\n        "persistent_max_constraint_delta_v_dof": "108",\n        "persistent_max_pre_projection_delta_v": str(pre_delta),\n        "persistent_max_pre_projection_delta_v_dof": "108",\n        "persistent_max_published_delta_v": "0.0021",\n        "persistent_max_published_delta_v_dof": "109",\n    }\n    if omit is not None:\n        fields.pop(omit)\n    line = " ".join(f'{key}="{value}"' if key == "source_support_metal_device" else f"{key}={value}"\n                    for key, value in fields.items())\n    (directory / "stdout.txt").write_text(line + "\\n")\n    (directory / "stderr.txt").write_text("")\n\n\ndef test_velocity_stages_are_bound_without_relabeling_constraint_impulse(tmp_path: Path) -> None:\n    _write_case(tmp_path)\n    row = refinement._case(tmp_path, "100us", 1.0e-4, 64)\n    stage = row["velocity_stage_diagnostics"]\n    assert stage["schema"] == "numi.human.velocity-stage-diagnostics.v1"\n    assert stage["maximum_free_acceleration_mixed_units"] == 1.5\n    assert stage["maximum_constraint_delta_v_mixed_units"] == 0.002\n    assert stage["reconstructed_pre_projection_rate_mixed_units"] == 20.0\n    assert row["persistent_max_acceleration_mps2"] == 20.0\n\n\ndef test_partial_velocity_stage_record_fails_closed(tmp_path: Path) -> None:\n    _write_case(tmp_path, omit="persistent_max_constraint_delta_v_dof")\n    with pytest.raises(ImportError, match="partial velocity-stage"):\n        refinement._case(tmp_path, "100us", 1.0e-4, 64)\n\n\ndef test_legacy_rate_must_reconstruct_preprojection_delta_v(tmp_path: Path) -> None:\n    _write_case(tmp_path, pre_delta=0.003)\n    with pytest.raises(ImportError, match="does not reconstruct"):\n        refinement._case(tmp_path, "100us", 1.0e-4, 64)\n''')
      - name: Run historical and new evidence regressions
        run: |
          python -m pytest -q \
            tests/test_native_passive_stand_refinement.py \
            tests/test_native_refinement_binding.py \
            tests/test_native_refinement_stage_diagnostics.py
          git diff --check
      - name: Publish tested source only
        run: |
          git add src/numilab_human/native_passive_stand_refinement.py tests/test_native_refinement_stage_diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate Human force acceleration from constraint delta-v evidence'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > human-velocity-stage-evidence-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-velocity-stage-evidence-source
          path: human-velocity-stage-evidence-revision.txt
          retention-days: 14
          if-no-files-found: warn
