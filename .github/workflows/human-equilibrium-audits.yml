name: Human equilibrium evidence audits
on:
  push:
    branches: [main]
    paths:
      - ".numi/commands/human"
      - "src/numilab_human/static_dynamic_handoff.py"
      - "src/numilab_human/native_force_convergence.py"
      - "src/numilab_human/equilibrium_force_snapshot.py"
      - "src/numilab_human/force_ledger.py"
      - "src/numilab_human/standing_initial_state.py"
      - "src/numilab_human/native_passive_stand_refinement.py"
      - "src/numilab_human/native_trace_refinement.py"
      - "tests/test_static_dynamic_handoff.py"
      - "tests/test_native_force_convergence.py"
      - "tests/test_equilibrium_force_snapshot.py"
      - "tests/test_initial_force_reference.py"
      - "tests/test_force_ledger.py"
      - "tests/test_standing_state.py"
      - "tests/test_native_passive_stand_refinement.py"
      - "tests/test_native_refinement_binding.py"
      - "tests/test_native_refinement_stage_diagnostics.py"
      - "tests/test_native_refinement_free_acceleration.py"
      - "tests/test_native_trace_refinement.py"
      - "tests/test_native_mechanics_summary.py"
      - "tests/test_stand_execution_options.py"
      - "tests/test_importer.py"
      - ".github/workflows/human-equilibrium-audits.yml"
  pull_request:
    paths:
      - ".numi/commands/human"
      - "src/numilab_human/*force*"
      - "src/numilab_human/*handoff*"
      - "src/numilab_human/*stand*"
      - "src/numilab_human/*trace*"
      - "tests/test_*force*"
      - "tests/test_*handoff*"
      - "tests/test_*stand*"
      - "tests/test_*trace*"
      - "tests/test_native_refinement_binding.py"
      - "tests/test_native_refinement_stage_diagnostics.py"
      - "tests/test_native_refinement_free_acceleration.py"
      - "tests/test_native_mechanics_summary.py"
      - "tests/test_importer.py"
      - ".github/workflows/human-equilibrium-audits.yml"
permissions:
  contents: read
jobs:
  audit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install audit package and test runner
        run: python -m pip install --upgrade pip pytest -e .
      - name: Run equilibrium and refinement contract tests
        run: >-
          python -m pytest -q --junitxml=human-equilibrium-results.xml
          tests/test_static_dynamic_handoff.py
          tests/test_native_force_convergence.py
          tests/test_equilibrium_force_snapshot.py
          tests/test_initial_force_reference.py
          tests/test_force_ledger.py
          tests/test_standing_state.py
          tests/test_native_passive_stand_refinement.py
          tests/test_native_refinement_binding.py
          tests/test_native_refinement_stage_diagnostics.py
          tests/test_native_refinement_free_acceleration.py
          tests/test_native_trace_refinement.py
          tests/test_native_mechanics_summary.py
          tests/test_stand_execution_options.py
      - name: Verify workspace launch compatibility
        run: python -m pytest -q --junitxml=human-workspace-results.xml tests/test_importer.py -k numi_workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: human-equilibrium-python-${{ matrix.python-version }}
          path: |
            human-equilibrium-results.xml
            human-workspace-results.xml
            src/numilab_human/model.py
            src/numilab_human/physiology.py
            src/numilab_human/native_passive_stand_refinement.py
            src/numilab_human/native_trace_refinement.py
            src/numilab_human/equilibrium_force_snapshot.py
            src/numilab_human/native_force_convergence.py
            src/numilab_human/force_ledger.py
            tests/test_native_refinement_binding.py
            tests/test_native_refinement_stage_diagnostics.py
            tests/test_native_refinement_free_acceleration.py
            tests/test_native_trace_refinement.py
            tests/test_equilibrium_force_snapshot.py
            tests/test_initial_force_reference.py
            tests/test_native_mechanics_summary.py
            tests/test_stand_execution_options.py
            .numi/commands/human
          include-hidden-files: true
          retention-days: 14
