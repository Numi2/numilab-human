[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numilab-human"
version = "0.1.0"
description = "Provenance-locked Human v1 source importer for Numi Lab"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"

[project.scripts]
numilab-human = "numilab_human.cli:main"

[project.optional-dependencies]
skin-authoring = ["numpy>=1.26.4,<2.7", "scipy==1.17.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
